name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/run.sh
  action:
    # Runs the GitHub Action on two projects shaped like Lovable exports:
    # planted problems must fail the job, the fixed project must pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Project with planted problems
        id: bad
        continue-on-error: true
        uses: ./
        with:
          working-directory: tests/action/lovable-bad
      - name: Fixed project, without config.toml
        id: clean
        uses: ./
        with:
          working-directory: tests/action/lovable-clean
          fail-on: info
      - name: Compare with the expected result
        env:
          BAD: ${{ steps.bad.outcome }} ${{ steps.bad.outputs.high }} ${{ steps.bad.outputs.medium }} ${{ steps.bad.outputs.low }} ${{ steps.bad.outputs.info }}
          CLEAN: ${{ steps.clean.outcome }} ${{ steps.clean.outputs.high }} ${{ steps.clean.outputs.medium }} ${{ steps.clean.outputs.low }} ${{ steps.clean.outputs.info }}
        run: |
          echo "planted: $BAD"; echo "fixed: $CLEAN"
          [ "$BAD" = "failure 2 3 4 0" ] || { echo "FAIL: expected 'failure 2 3 4 0' for the planted project"; exit 1; }
          [ "$CLEAN" = "success 0 0 0 0" ] || { echo "FAIL: expected 'success 0 0 0 0' for the fixed project"; exit 1; }
          echo "PASS: planted project fails with 2 high, fixed project passes with nothing found"
